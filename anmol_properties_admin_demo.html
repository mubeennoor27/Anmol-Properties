<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmol Properties Admin</title><style>
body{font-family:Arial;margin:0;background:#f4f6fa;color:#172033}header{background:#0d47a1;color:#fff;padding:18px 5%;font-size:24px;font-weight:bold}.wrap{max-width:1050px;margin:30px auto;padding:15px}.box{background:#fff;padding:22px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 15px #0001}input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd4df;border-radius:7px;box-sizing:border-box}button{padding:11px 16px;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin:3px}.blue{background:#0d47a1;color:#fff}.green{background:#198754;color:#fff}.red{background:#c62828;color:#fff}.gray{background:#e8edf5}.hidden{display:none}.login{max-width:400px;margin:70px auto}.item{border:1px solid #e0e5ec;border-radius:10px;padding:15px;margin:12px 0}.stats{display:flex;gap:12px}.stat{flex:1;background:#f7f9fc;padding:15px;border-radius:9px}.stat b{font-size:25px}@media(max-width:700px){.stats{display:block}.stat{margin:8px 0}}
</style></head><body><header>ANMOL PROPERTIES — Admin Panel</header>
<div id="login" class="box login"><h2>🔐 Admin Login</h2><input id="u" value="admin" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button class="blue" onclick="login()">Login</button><p id="err"></p><small>Demo login: admin / 12345</small></div>
<div id="app" class="wrap hidden"><div class="box"><h2>Dashboard</h2><div class="stats"><div class="stat">Pending<br><b id="p">0</b></div><div class="stat">Approved<br><b id="a">0</b></div><div class="stat">Rejected<br><b id="r">0</b></div></div></div>
<div class="box"><h3>➕ Add Property</h3><form id="form"><input name="title" placeholder="Property title" required><select name="purpose" required><option value="">Sale / Rent</option><option>Sale</option><option>Rent</option></select><select name="type" required><option value="">Type</option><option>House</option><option>Plot</option><option>Shop</option><option>Office</option><option>Commercial</option></select><input name="area" placeholder="Location" required><input name="price" placeholder="Price" required><input name="contact" placeholder="Phone / WhatsApp" required><textarea name="description" placeholder="Description"></textarea><button class="blue">Add as Pending</button></form></div>
<div class="box"><h3>📋 Property Approval</h3><div id="list"></div></div><button class="gray" onclick="location.reload()">Logout</button></div>
<script>
const K="anmol_admin_properties";
function get(){return JSON.parse(localStorage.getItem(K)||"[]")}function save(x){localStorage.setItem(K,JSON.stringify(x));render()}
function login(){if(u.value==="admin"&&pw.value==="12345"){loginBox();seed();render()}else err.textContent="Wrong username or password."}
function loginBox(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden")}
function seed(){if(!localStorage.getItem(K))save([{id:1,title:"5 Marla Furnished House",purpose:"Sale",type:"House",area:"Citi Housing",price:"Contact for price",contact:"03266528836",description:"Furnished house.",status:"approved"},{id:2,title:"Commercial Plaza",purpose:"Sale",type:"Commercial",area:"Mumtaz Market GT Road",price:"Contact for price",contact:"03000266330",description:"Commercial property.",status:"pending"}])}
function render(){let x=get(),p=x.filter(z=>z.status==="pending").length,a=x.filter(z=>z.status==="approved").length,r=x.filter(z=>z.status==="rejected").length;document.getElementById("p").textContent=p;document.getElementById("a").textContent=a;document.getElementById("r").textContent=r;document.getElementById("list").innerHTML=x.length?x.map(z=>`<div class="item"><b>${esc(z.title)}</b><p>${esc(z.type)} · ${esc(z.purpose)} · ${esc(z.area)}</p><p>${esc(z.price)} | ${esc(z.contact)}</p><p>${esc(z.description||"")}</p><b>Status: ${z.status}</b><br>${z.status==="pending"?`<button class="green" onclick="status(${z.id},'approved')">Approve</button><button class="red" onclick="status(${z.id},'rejected')">Reject</button>`:""}<button class="gray" onclick="del(${z.id})">Delete</button></div>`).join(""):"No properties."}
function status(id,s){save(get().map(z=>z.id===id?{...z,status:s}:z))}function del(id){save(get().filter(z=>z.id!==id))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
form.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));x.id=Date.now();x.status="pending";save([...get(),x]);form.reset()}
</script></body></html>
